name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Alembic migration against SQLite test database
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
        run: alembic upgrade head
      - name: Run backend test suite
        env:
          JWT_SECRET: ci-test-secret-which-is-over-32-characters-not-for-production
        run: python -m pytest -q
