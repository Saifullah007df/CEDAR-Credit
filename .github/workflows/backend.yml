name: Backend integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cedar
          POSTGRES_USER: cedar
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cedar -d cedar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cedar:ci-only-not-a-real-secret@localhost:5432/cedar
      JWT_SECRET: ci-testing-only-unique-temporary-secret-over-32-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend + OCR extras + test dependencies
        run: python -m pip install -e '.[dev,ocr]'
      - name: Migrate PostgreSQL with Alembic
        run: alembic upgrade head
      - name: Validate PostgreSQL schema and seed synthetic lenders
        run: |
          python -m app.cli seed-demo
          python -m app.cli seed-demo
          python -c "from app.db import get_engine; from sqlalchemy import inspect; names=set(inspect(get_engine()).get_table_names()); assert {'users','policy_versions','evidence_revisions','review_tasks','repayment_schedules','document_extractions','utilization_claims'}.issubset(names), names"
      - name: Run backend unit and end-to-end tests
        run: python -m pytest -q
