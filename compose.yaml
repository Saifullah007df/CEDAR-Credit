services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cedar
      POSTGRES_USER: cedar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cedar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedar -d cedar"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cedar_pgdata:
